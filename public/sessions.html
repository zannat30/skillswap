<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap | Active Sessions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-box">S</div>
                <h2>Skill<span>Swap</span></h2>
            </div>
            <nav class="sidebar-nav">
                <p class="nav-label">Main Menu</p>
                <a href="index.html" class="nav-item"><i data-lucide="compass"></i><span>Marketplace</span></a>
                <a href="sessions.html" class="nav-item active"><i data-lucide="book-open"></i><span>Active Sessions</span><span class="badge">1</span></a>
                <a href="skillbot.html" class="nav-item"><i data-lucide="message-square"></i><span>AI SkillBot</span></a>
                <a href="profile.html" class="nav-item"><i data-lucide="user"></i><span>My Profile</span></a>
                <a href="leaderboard.html" class="nav-item"><i data-lucide="trophy"></i><span>Leaderboard</span></a>
            </nav>
        </aside>

        <div class="main-wrapper">
            <!-- Navbar -->
            <header class="navbar">
                <div class="search-bar">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" placeholder="Search skills, mentors, or domains...">
                </div>
                <div class="nav-actions">
                    <div class="credit-wallet"><i data-lucide="wallet"></i><span>100 Credits</span></div>
                    <div class="user-profile"><div class="avatar">Z</div></div>
                </div>
            </header>

            <main id="app-view">
                <section class="view active">
                    <h2>Active Sessions</h2>
                    
                    <div class="active-session-card glass-panel mt-4">
                        <div class="session-header">
                            <div class="status-badge pulse-active"><i data-lucide="radio"></i> LIVE</div>
                            <h3 class="ml-auto timer-display glowing-text" id="session-timer">60:00</h3>
                        </div>
                        <div class="session-body">
                            <div class="flex gap-4 items-center">
                                <div class="avatar-sm">AR</div>
                                <div>
                                    <h4 class="text-lg">React.js Mentorship</h4>
                                    <p class="text-secondary text-sm">with Alex Rivera</p>
                                </div>
                            </div>
                            <div class="session-actions mt-4 flex gap-4">
                                <button class="btn btn-primary"><i data-lucide="video"></i> Join Meeting</button>
                                <button class="btn btn-danger" id="end-session-btn"><i data-lucide="check-circle"></i> End Session</button>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Feedback Modal -->
    <div class="modal-overlay" id="feedback-modal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3>Session Completed</h3>
            </div>
            <div class="modal-body text-center">
                <div class="success-icon mb-4"><i data-lucide="check-circle-2"></i></div>
                <p>How was your session with Alex Rivera?</p>
                <div class="feedback-actions mt-6">
                    <button class="btn btn-primary w-full justify-center mb-3" onclick="alert('45 Credits Released to Mentor! (5 burned)'); window.location.href='index.html';"><i data-lucide="thumbs-up"></i> Mark as Learnt</button>
                    <button class="btn glass-btn w-full justify-center text-red-400 border-red-900/50 hover:bg-red-900/20"><i data-lucide="thumbs-down"></i> Didn't Learn (Dispute)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/sessions.js"></script>
</body>
</html>
